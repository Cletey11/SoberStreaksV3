<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sober Streaks</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>Sober Streaks</h1><p>Track sober days together.</p></header><section class="top"><label>Who are you?<select id="person"></select></label><div id="myStats"></div></section><section class="layout"><div class="card calendarCard"><div class="calHead"><button id="prev">‹</button><h2 id="month"></h2><button id="next">›</button></div><div id="legend" class="legend"></div><div class="week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="calendar" class="calendar"></div><p class="hint">Colored dots show who was sober. A colored × shows who drank. Click a date to record your status.</p></div><aside class="card"><h2>🏆 Leaderboard</h2><div id="leaderboard"></div></aside></section><div id="modal" class="modal hidden"><div class="dialog"><button id="close" class="x">×</button><h2 id="dialogDate"></h2><p>Set your status for this day.</p><div class="actions"><button id="sober">✓ Sober</button><button id="drank">× Drank</button><button id="clear">Clear</button></div></div></div></main><script src="app.js"></script></body></html>
